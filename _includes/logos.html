<div class="logos">
  <h2 class="eyebrow">Background</h2>
  <ul class="logos-list">
    <li><img class="is-tall" src="{{ '/assets/img/logo-princeton.webp' | relative_url }}" width="574" height="160" alt="Princeton University"></li>
    <li><img src="{{ '/assets/img/logo-berkeley.webp' | relative_url }}" width="858" height="160" alt="UC Berkeley"></li>
    <li><img src="{{ '/assets/img/logo-microsoft.webp' | relative_url }}" width="745" height="160" alt="Microsoft"></li>
    <li><img src="{{ '/assets/img/logo-imo.webp' | relative_url }}" width="580" height="160" alt="International Mathematical Olympiad"></li>
    {% if include.all %}
    <li><img src="{{ '/assets/img/logo-openmined.webp' | relative_url }}" width="623" height="160" alt="OpenMined"></li>
    <li><img class="is-tall" src="{{ '/assets/img/logo-iitm.webp' | relative_url }}" width="461" height="160" alt="IIT Madras"></li>
    <li><img class="is-tall" src="{{ '/assets/img/logo-oist.webp' | relative_url }}" width="257" height="160" alt="OIST"></li>
    {% endif %}
  </ul>
</div>

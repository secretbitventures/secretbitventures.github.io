<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ site.title }}</title>
  <link rel="canonical" href="{{ site.url }}{{ page.redirect_to }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
</head>
<body><p><a href="{{ page.redirect_to | relative_url }}">Continue to {{ site.title }}</a></p></body>
</html>
